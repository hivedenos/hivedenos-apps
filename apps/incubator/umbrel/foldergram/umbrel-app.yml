releaseNotes: >-
  ⚠️ Back up your library database before updating. If you have folders named "carousels", review the migration choice in Settings → General Settings, then run Scan Library to apply your chosen folder behavior.


  - Browse folder-based Carousel posts with multiple photos and videos.
  - Share individual folders with expiring links or passwords and read-only access.
  - Exclude folders from your library using .nofoldergram marker files.
  - Added German translations and improved video previews and mobile media viewing.
  - Improved scan reliability, deletion recovery, and Docker runtime security.


  Full release notes: https://github.com/foldergram/foldergram/releases/tag/v1.3.0
