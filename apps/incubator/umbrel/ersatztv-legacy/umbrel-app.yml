manifestVersion: 1
id: ersatztv-legacy
storage:
  dataRoot: data
category: media
name: ErsatzTV Legacy
version: "26.11.6"
tagline: Build your own live TV channels
description: >-
  ErsatzTV Legacy transforms your personal media library into custom live TV channels with IPTV, XMLTV guide data, channel scheduling, and browser playback.


  Connect local media from Umbrel's Downloads folder or libraries from Plex, Jellyfin, and Emby, then create channels that can be watched from IPTV clients, media servers, or a web browser.


  Hardware acceleration can be enabled on supported devices by creating a hardware-accelerated FFmpeg profile in ErsatzTV and assigning it to your channels.


  This package uses the ErsatzTV Legacy release stream, which upstream continues to maintain for security updates while ErsatzTV Next remains an experimental rewrite.
releaseNotes: >-
  This update improves channel playback and media library accuracy.


  - Improves hardware-accelerated playback, including VAAPI tone mapping and HEVC encoding, and fixes several QSV and AMD playback issues.

  - Fixes selection of embedded text subtitles and incorrect stream aspect ratios.

  - Fixes aspect ratio detection for newly scanned local media. Run a deep scan to correct existing items.

  - Fixes Trakt-generated playlists so they match items correctly and remove entries no longer in the Trakt list.

  - Uses your configured background image for offline and error streams in the Next engine.


  Full release notes can be found at https://github.com/ErsatzTV/legacy/releases/tag/v26.11.6
developer: ErsatzTV
website: https://ersatztv.org
dependencies: []
repo: https://github.com/ErsatzTV/legacy
support: https://discuss.ersatztv.org
port: 8409
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
path: ""
defaultUsername: ""
defaultPassword: ""
backupIgnore:
  - data/transcode/*
permissions:
  - STORAGE_DOWNLOADS
  - GPU
submitter: phelipebf
submission: https://github.com/getumbrel/umbrel-apps/pull/4624
